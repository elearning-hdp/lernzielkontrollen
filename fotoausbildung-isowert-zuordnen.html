    border-radius: 6px;
    container-type: inline-size;
    user-select: none;
  }
  .zone {
    position: absolute;
    width: 13.63%;
    height: 16.3%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: .6cqw;
    border-radius: 2px;
    transition: background-color .15s, outline-color .15s;
    outline: 3px dashed transparent;
    outline-offset: -6px;
  }
  .zone.left  { left: 3.22%; }
  .zone.right { left: 83.11%; }
  .zone.r1 { top: 15.17%; }
  .zone.r2 { top: 44.5%; }
  .zone.r3 { top: 73.83%; }
  .zone.hover, body.picking .zone:not(:has(.card)) { outline-color: #b9b9b9; }
  .zone.hover { background: #eef5ff; outline-color: var(--focus); }

  /* Begriffskarten */
  .card {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 7.5em;
    padding: .55em .9em;
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: grab;
    touch-action: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    transition: background-color .15s, border-color .15s, box-shadow .15s;
  }
  .card:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .card.selected { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(43,108,176,.35); }
  .zone .card {
    width: 100%;
    height: 100%;
    min-width: 0;
    padding: 0 .3em;
    font-size: clamp(11px, 1.7cqw, 22px);
    border-width: 2px;
  }
  .card.ok  { background: var(--ok);  border-color: var(--ok-border); }
  .card.bad { background: var(--bad); border-color: var(--bad-border); }
  .card.dragging {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    cursor: grabbing;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
    transform: rotate(-2deg);
  }

  /* Ablage für Begriffe */
  .bank {
    margin-top: 14px;
    min-height: 64px;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    background: #e7e4de;
    border: 2px dashed #c4c0b8;
    border-radius: 8px;
  }
  .bank.hover { border-color: var(--focus); background: #eef5ff; }
  .bank:empty::before {
    content: "Alle Begriffe sind zugeordnet.";
    color: var(--muted);
    font-size: .9rem;
    align-self: center;
  }

  .controls {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  button.btn {
    font: inherit;
    font-weight: 600;
    padding: .6em 1.2em;
    border-radius: 6px;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.btn.secondary { background: transparent; color: var(--accent); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .feedback { font-weight: 600; min-height: 1.4em; }
  .feedback.ok { color: var(--ok-border); }
  .feedback.bad { color: var(--bad-border); }
  .hint { margin-top: 10px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>ISO, Verschlusszeit &amp; Bildqualität</h1>
  <p class="intro">Ziehe die Begriffe an die passenden Enden der Pfeile.</p>

  <div class="stage" id="stage" role="img" aria-label="Drei Pfeile: ISO von 80 bis 1600, Verschlusszeit und Bildqualität">
    <div class="zone left r1"  data-answer="niedrig" aria-label="ISO, linkes Ende"></div>
    <div class="zone right r1" data-answer="hoch"    aria-label="ISO, rechtes Ende"></div>
    <div class="zone left r2"  data-answer="lang"    aria-label="Verschlusszeit, linkes Ende"></div>
    <div class="zone right r2" data-answer="kurz"    aria-label="Verschlusszeit, rechtes Ende"></div>
    <div class="zone left r3"  data-answer="fein"    aria-label="Bildqualität, linkes Ende"></div>
    <div class="zone right r3" data-answer="grob"    aria-label="Bildqualität, rechtes Ende"></div>
  </div>

  <div class="bank" id="bank" aria-label="Begriffe"></div>

  <div class="controls">
    <button class="btn" id="check" disabled>Überprüfen</button>
    <button class="btn secondary" id="reset">Neu starten</button>
    <span class="feedback" id="feedback" aria-live="polite"></span>
  </div>
  <p class="hint">Tipp: Du kannst einen Begriff auch antippen und danach das Feld antippen, in das er gehört.</p>
</div>

<script>
(function () {
  const WORDS = ["niedrig", "hoch", "lang", "kurz", "fein", "grob"];

  const bank = document.getElementById("bank");
  const zones = Array.from(document.querySelectorAll(".zone"));
  const checkBtn = document.getElementById("check");
  const resetBtn = document.getElementById("reset");
  const feedback = document.getElementById("feedback");

  let selected = null;   // für Tippen-statt-Ziehen
  let drag = null;       // aktueller Drag-Zustand
  let justDragged = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function build() {
    bank.innerHTML = "";
    zones.forEach(z => z.innerHTML = "");
    shuffle(WORDS).forEach(w => {
      const c = document.createElement("div");
      c.className = "card";
      c.textContent = w;
      c.dataset.word = w;
      c.tabIndex = 0;
      c.setAttribute("role", "button");
      c.addEventListener("pointerdown", onPointerDown);
      c.addEventListener("click", onCardClick);
      c.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSelect(c); }
      });
      bank.appendChild(c);
    });
    clearFeedback();
    setSelected(null);
    updateCheck();
  }

  function clearFeedback() {
    feedback.textContent = "";
    feedback.className = "feedback";
    document.querySelectorAll(".card").forEach(c => c.classList.remove("ok", "bad"));
  }

  function updateCheck() {
    checkBtn.disabled = zones.some(z => !z.querySelector(".card"));
  }

  // Karte in Ziel legen; liegt dort schon eine, wandert die zurück an den Ursprung der neuen
  function placeCard(card, target) {
    const from = card.parentElement;
    if (target.classList.contains("zone")) {
      const existing = target.querySelector(".card");
      if (existing && existing !== card) {
        (from && from.classList.contains("zone") ? from : bank).appendChild(existing);
      }
    }
    target.appendChild(card);
    clearFeedback();
    updateCheck();
  }

  // --- Tippen / Tastatur ---
  function setSelected(card) {
    if (selected) selected.classList.remove("selected");
    selected = card;
    if (card) card.classList.add("selected");
    document.body.classList.toggle("picking", !!card);
  }
  function toggleSelect(card) { setSelected(selected === card ? null : card); }

  function onCardClick(e) {
    e.stopPropagation();
    if (justDragged) return;
    const card = e.currentTarget;
    const zone = card.parentElement.classList.contains("zone") ? card.parentElement : null;
    if (selected && selected !== card && zone) {
      placeCard(selected, zone);   // getippte Karte auf belegtes Feld: tauschen
      setSelected(null);
    } else {
      toggleSelect(card);
    }
  }

  zones.forEach(z => {
    z.tabIndex = 0;
    z.addEventListener("click", () => { if (selected) { placeCard(selected, z); setSelected(null); } });
    z.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && selected) { e.preventDefault(); placeCard(selected, z); setSelected(null); }
    });
  });
  bank.addEventListener("click", e => {
    if (selected && e.target === bank) { placeCard(selected, bank); setSelected(null); }
  });

  // --- Ziehen (Maus & Touch) ---
  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const card = e.currentTarget;
    const rect = card.getBoundingClientRect();
    drag = {
      card,
      startX: e.clientX, startY: e.clientY,
      offX: e.clientX - rect.left, offY: e.clientY - rect.top,
      w: rect.width, h: rect.height,
      moved: false, overEl: null, placeholder: null
    };
    card.setPointerCapture(e.pointerId);
    card.addEventListener("pointermove", onPointerMove);
    card.addEventListener("pointerup", onPointerUp);
    card.addEventListener("pointercancel", onPointerUp);
  }

  function onPointerMove(e) {
    if (!drag) return;
    const { card } = drag;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 5) return;
      drag.moved = true;
      setSelected(null);
      // Platzhalter, damit das Layout nicht springt
      const ph = document.createElement("div");
      ph.style.width = drag.w + "px";
      ph.style.height = drag.h + "px";
      if (card.parentElement.classList.contains("zone")) { ph.style.width = "100%"; ph.style.height = "100%"; }
      card.parentElement.insertBefore(ph, card);
      drag.placeholder = ph;
      card.style.width = drag.w + "px";
      card.style.height = drag.h + "px";
      card.classList.add("dragging");
    }
    card.style.left = (e.clientX - drag.offX) + "px";
    card.style.top = (e.clientY - drag.offY) + "px";

    const target = dropTargetAt(e.clientX, e.clientY);
    if (target !== drag.overEl) {
      if (drag.overEl) drag.overEl.classList.remove("hover");
      if (target) target.classList.add("hover");
      drag.overEl = target;
    }
  }

  function onPointerUp(e) {
    if (!drag) return;
    const { card, moved, overEl, placeholder } = drag;
    card.removeEventListener("pointermove", onPointerMove);
    card.removeEventListener("pointerup", onPointerUp);
    card.removeEventListener("pointercancel", onPointerUp);
    if (overEl) overEl.classList.remove("hover");
    if (placeholder) placeholder.remove();
    card.classList.remove("dragging");
    card.style.left = card.style.top = card.style.width = card.style.height = "";
    drag = null;

    if (!moved) return; // Tippen wird über "click" behandelt
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 0);
    if (overEl && e.type === "pointerup") placeCard(card, overEl);
  }

  function dropTargetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    return el.closest(".zone") || el.closest(".bank");
  }

  // --- Auswertung ---
  checkBtn.addEventListener("click", () => {
    let correct = 0;
    zones.forEach(z => {
      const c = z.querySelector(".card");
      if (!c) return;
      const ok = c.dataset.word === z.dataset.answer;
      c.classList.toggle("ok", ok);
      c.classList.toggle("bad", !ok);
      if (ok) correct++;
    });
    if (correct === zones.length) {
      feedback.textContent = "Super, alles richtig!";
      feedback.className = "feedback ok";
    } else {
      feedback.textContent = correct + " von " + zones.length + " richtig. Verschiebe die roten Begriffe und prüfe erneut.";
      feedback.className = "feedback bad";
    }
  });

  resetBtn.addEventListener("click", build);

  build();
})();
</script>
</body>
</html>
