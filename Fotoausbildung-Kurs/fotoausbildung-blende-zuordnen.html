<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blende: Karten zuordnen</title>
<style>
  :root {
    --hintergrund: #121212;
    --rot: #E90022;
    --gruen: #89D155;
    --feld: #000;
    --text: #f2f2f2;
    --text-leise: #b4b4b4;
    --platz-leer: rgba(255, 255, 255, 0.14);
    --fokus: #3B8BFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--hintergrund);
    color: var(--text);
    font-family: "Montserrat", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }

  body { padding: clamp(12px, 2.5vw, 28px); }
  body.zieht { cursor: grabbing; user-select: none; -webkit-user-select: none; }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 7fr) minmax(0, 3fr);
    gap: clamp(16px, 3vw, 44px);
    align-items: center;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ---------- Bild mit Ablagefeldern ---------- */
  .bildflaeche {
    position: relative;
    background: #fff;
    aspect-ratio: var(--bild-seitenverhaeltnis);
    user-select: none;
    -webkit-user-select: none;
  }
  .bildflaeche img {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .feld {
    position: absolute;
    background: var(--feld);
    cursor: pointer;
    transition: box-shadow 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .feld.ziel { box-shadow: 0 0 0 4px var(--rot); }
  .app.hat-auswahl .feld:not(:has(.karte)) { box-shadow: 0 0 0 2px var(--rot); }
  .app.hat-auswahl .feld.ziel { box-shadow: 0 0 0 4px var(--rot); }

  /* ---------- Karten ---------- */
  .karte {
    appearance: none;
    border: 0;
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    position: relative;
    background: var(--rot);
    color: #000;
    font: inherit;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    container-type: inline-size;
  }
  .karte span {
    font-weight: 800;
    line-height: 1;
    font-size: clamp(12px, 1.5vw, 26px);   /* Rückfall für ältere Browser */
    font-size: 20cqw;                       /* wächst mit der Kartenbreite */
  }

  .karte.wird-gezogen { opacity: 0.3; }
  .karte.ausgewaehlt { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #000; z-index: 2; }
  .karte:focus-visible,
  .feld:focus-visible,
  .knopf:focus-visible { outline: 3px solid var(--fokus); outline-offset: 4px; }

  .karte.richtig { background: var(--gruen); }
  .karte.falsch  { animation: wackeln 0.35s ease-in-out; }
  .karte.richtig::after,
  .karte.falsch::after {
    position: absolute;
    top: 50%;
    right: 5cqw;
    translate: 0 -50%;
    width: 14cqw;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #000;
    color: #fff;
    font-size: 9cqw;
    font-weight: 800;
    line-height: 1;
  }
  .karte.richtig::after { content: "✓"; }
  .karte.falsch::after  { content: "✕"; }
  .karte:disabled { cursor: default; }

  .geist {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    rotate: -2deg;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
  }

  @keyframes wackeln {
    0%, 100% { translate: 0 0; }
    25% { translate: -5px 0; }
    75% { translate: 5px 0; }
  }

  /* ---------- Ablage und Steuerung ---------- */
  .seite {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 2.5vw, 28px);
  }

  .ablage {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(10px, 1.3vw, 18px) clamp(16px, 3.5vw, 44px);
    width: 100%;
    padding: 8px;
    transition: box-shadow 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .ablage.ziel { box-shadow: inset 0 0 0 2px var(--rot); }

  .platz {
    aspect-ratio: var(--feld-seitenverhaeltnis);
    outline: 2px dashed var(--platz-leer);
    outline-offset: -2px;
  }
  .platz:has(.karte) { outline-color: transparent; }

  .steuerung { display: flex; align-items: center; gap: 16px; }

  .knopf {
    appearance: none;
    border: 0;
    padding: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .knopf svg { display: block; }
  .knopf-pruefen { width: 68px; height: 68px; background: var(--gruen); }
  .knopf-pruefen:hover { filter: brightness(1.08); }
  .knopf-neu { width: 44px; height: 44px; background: #2b2b2b; color: #d6d6d6; }
  .knopf-neu:hover { background: #383838; }
  .app.fertig .knopf-pruefen { opacity: 0.4; cursor: default; filter: none; }

  .status {
    margin: 0;
    min-height: 3em;
    max-width: 30ch;
    text-align: center;
    font-size: 15px;
    line-height: 1.45;
    color: var(--text-leise);
  }
  .status.alles-richtig { color: var(--gruen); font-weight: 700; font-size: 17px; }

  /* ---------- Schmale Ansicht (Handy) ---------- */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .ablage { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; max-width: 620px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .karte.falsch { animation: none; }
    .feld, .ablage { transition: none; }
    .geist { rotate: 0deg; }
  }
</style>
</head>

<script>
/* =====================================================================
   AUFGABE – nur dieser Block muss für neue Bild-Übungen angepasst werden
   ---------------------------------------------------------------------
   bildBreite / bildHoehe: Pixelmaße der Bilddatei
   felder: Ablagefelder auf dem Bild in Pixeln
           (x, y = linke obere Ecke; b, h = Breite, Höhe)
           loesung = das Wort, das in dieses Feld gehört
           name    = Beschreibung für Screenreader
   karten: Wörter in der Ablage, zeilenweise (2 pro Zeile)

   Geprüft wird nur, ob das Wort auf der Karte mit "loesung" des Feldes
   übereinstimmt. Gleiche Wörter (z. B. 3x "klein") sind deshalb
   untereinander austauschbar – egal, auf welchem passenden Feld sie liegen.
   ===================================================================== */
const AUFGABE = {
  bildBreite: 1658,
  bildHoehe: 949,
  felder: [
    { x: 64,   y: 431, b: 259, h: 92, loesung: "groß",  name: "Blende bei f/2.8" },
    { x: 64,   y: 553, b: 259, h: 93, loesung: "groß",  name: "Lichtmenge bei f/2.8" },
    { x: 64,   y: 676, b: 259, h: 93, loesung: "klein", name: "Schärfentiefe bei f/2.8" },
    { x: 64,   y: 800, b: 259, h: 93, loesung: "kurz",  name: "Verschlusszeit bei f/2.8" },
    { x: 1365, y: 431, b: 254, h: 92, loesung: "klein", name: "Blende bei f/11" },
    { x: 1365, y: 553, b: 254, h: 93, loesung: "klein", name: "Lichtmenge bei f/11" },
    { x: 1365, y: 676, b: 254, h: 93, loesung: "groß",  name: "Schärfentiefe bei f/11" },
    { x: 1365, y: 800, b: 254, h: 93, loesung: "lang",  name: "Verschlusszeit bei f/11" }
  ],
  karten: ["klein", "lang", "klein", "groß", "klein", "groß", "kurz", "groß"]
};

const TEXTE = {
  start:      "Karten auf die passenden schwarzen Felder ziehen. Alternativ erst eine Karte, dann ein Feld antippen.",
  leer:       "Noch keine Karte liegt auf einem Feld.",
  allesRichtig: "Alles richtig!",
  teilweise:  (richtig, gesamt) => `${richtig} von ${gesamt} richtig.`,
  falsche:    "Karten mit ✕ verschieben und erneut prüfen.",
  freieFelder: (n) => n === 1 ? "1 Feld ist noch leer." : `${n} Felder sind noch leer.`
};

/* ===================================================================== */

const app = document.getElementById("app");
const bildflaeche = document.getElementById("bildflaeche");
const ablage = document.getElementById("ablage");
const statusZeile = document.getElementById("status");

let auswahl = null;      // per Antippen ausgewählte Karte
let fertig = false;      // alles richtig gelöst
let zug = null;          // laufender Ziehvorgang
let klickSperreBis = 0;  // verhindert, dass nach dem Ziehen ein "Klick" ausgelöst wird

const prozent = (wert, gesamt) => (wert / gesamt * 100) + "%";
const RAND = 2;  // Felder ragen 2 Bildpixel über die gezeichneten Kästchen, damit kein Rahmen durchblitzt

document.documentElement.style.setProperty("--bild-seitenverhaeltnis", `${AUFGABE.bildBreite} / ${AUFGABE.bildHoehe}`);
const f0 = AUFGABE.felder[0];
document.documentElement.style.setProperty("--feld-seitenverhaeltnis", `${f0.b} / ${f0.h}`);

/* ---------- Felder aufs Bild legen ---------- */
const felder = AUFGABE.felder.map((f) => {
  const el = document.createElement("div");
  el.className = "feld";
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.setAttribute("aria-label", "Feld " + f.name);
  el.dataset.loesung = f.loesung;
  el.style.left = prozent(f.x - RAND, AUFGABE.bildBreite);
  el.style.top = prozent(f.y - RAND, AUFGABE.bildHoehe);
  el.style.width = prozent(f.b + 2 * RAND, AUFGABE.bildBreite);
  el.style.height = prozent(f.h + 2 * RAND, AUFGABE.bildHoehe);

  el.addEventListener("click", () => {
    if (fertig || !auswahl) return;
    legeAb(auswahl, el);
    waehle(null);
  });
  el.addEventListener("keydown", (e) => {
    if (e.target !== el) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
  });

  bildflaeche.appendChild(el);
  return el;
});

/* ---------- Karten in die Ablage legen ---------- */
const karten = AUFGABE.karten.map((wort) => {
  const platz = document.createElement("div");
  platz.className = "platz";

  const k = document.createElement("button");
  k.type = "button";
  k.className = "karte";
  k.dataset.wert = wort;
  const span = document.createElement("span");
  span.textContent = wort;
  k.appendChild(span);
  k.zuhause = platz;

  k.addEventListener("click", (e) => {
    e.stopPropagation();
    if (fertig || performance.now() < klickSperreBis) return;
    const feldDerKarte = feldVon(k);
    if (auswahl && auswahl !== k && feldDerKarte) {
      legeAb(auswahl, feldDerKarte);   // ausgewählte Karte auf dieses Feld (tauschen)
      waehle(null);
      return;
    }
    waehle(auswahl === k ? null : k);
  });

  k.addEventListener("pointerdown", (e) => {
    if (fertig || e.button !== 0) return;
    const r = k.getBoundingClientRect();
    zug = { k, id: e.pointerId, sx: e.clientX, sy: e.clientY,
            dx: e.clientX - r.left, dy: e.clientY - r.top, r, geist: null };
    k.setPointerCapture(e.pointerId);
  });

  k.addEventListener("pointermove", (e) => {
    if (!zug || zug.k !== k || e.pointerId !== zug.id) return;
    if (!zug.geist) {
      if (Math.hypot(e.clientX - zug.sx, e.clientY - zug.sy) < 6) return;
      starteGeist();
    }
    zug.geist.style.left = (e.clientX - zug.dx) + "px";
    zug.geist.style.top = (e.clientY - zug.dy) + "px";
    markiereZiel(findeZiel(e.clientX, e.clientY));
  });

  k.addEventListener("pointerup", (e) => {
    if (!zug || zug.k !== k || e.pointerId !== zug.id) return;
    if (zug.geist) {
      const ziel = findeZiel(e.clientX, e.clientY);
      if (ziel) legeAb(k, ziel);
      waehle(null);
      klickSperreBis = performance.now() + 400;
    }
    beendeZug();
  });

  k.addEventListener("pointercancel", beendeZug);

  platz.appendChild(k);
  ablage.appendChild(platz);
  return k;
});

ablage.addEventListener("click", () => {
  if (fertig || !auswahl) return;
  legeAb(auswahl, "ablage");
  waehle(null);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") waehle(null);
});

/* ---------- Hilfsfunktionen ---------- */
function feldVon(k) {
  return k.parentElement && k.parentElement.classList.contains("feld") ? k.parentElement : null;
}

function legeAb(k, ziel) {
  if (ziel === "ablage") {
    if (k.parentElement !== k.zuhause) { k.zuhause.appendChild(k); veraendert(k); }
    return;
  }
  const besetzer = ziel.querySelector(".karte");
  if (besetzer === k) return;
  if (besetzer) {
    const herkunft = feldVon(k);
    if (herkunft) herkunft.appendChild(besetzer);  // Karten tauschen
    else besetzer.zuhause.appendChild(besetzer);   // zurück in die Ablage
    veraendert(besetzer);
  }
  ziel.appendChild(k);
  veraendert(k);
}

function veraendert(k) {
  k.classList.remove("richtig", "falsch");
  zeigeStatus(TEXTE.start);
}

function waehle(k) {
  if (auswahl) auswahl.classList.remove("ausgewaehlt");
  auswahl = k;
  if (auswahl) auswahl.classList.add("ausgewaehlt");
  app.classList.toggle("hat-auswahl", !!auswahl);
}

function findeZiel(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const feld = el.closest(".feld");
  if (feld) return feld;
  if (el.closest(".ablage")) return "ablage";
  return null;
}

let markiertesZiel = null;
function markiereZiel(ziel) {
  const el = ziel === "ablage" ? ablage : ziel;
  if (el === markiertesZiel) return;
  if (markiertesZiel) markiertesZiel.classList.remove("ziel");
  markiertesZiel = el;
  if (el) el.classList.add("ziel");
}

function starteGeist() {
  const g = zug.k.cloneNode(true);
  g.classList.remove("ausgewaehlt", "richtig", "falsch", "wird-gezogen");
  g.classList.add("geist");
  g.setAttribute("aria-hidden", "true");
  g.tabIndex = -1;
  g.style.width = zug.r.width + "px";
  g.style.height = zug.r.height + "px";
  document.body.appendChild(g);
  zug.geist = g;
  zug.k.classList.add("wird-gezogen");
  document.body.classList.add("zieht");
}

function beendeZug() {
  if (!zug) return;
  if (zug.geist) zug.geist.remove();
  zug.k.classList.remove("wird-gezogen");
  document.body.classList.remove("zieht");
  markiereZiel(null);
  zug = null;
}

function zeigeStatus(text, allesRichtig = false) {
  statusZeile.textContent = text;
  statusZeile.classList.toggle("alles-richtig", allesRichtig);
}

/* ---------- Prüfen und Neustart ---------- */
document.getElementById("pruefen").addEventListener("click", () => {
  if (fertig) return;
  waehle(null);
  let belegt = 0, richtig = 0;

  felder.forEach((f) => {
    const k = f.querySelector(".karte");
    if (!k) return;
    belegt++;
    const stimmt = k.dataset.wert === f.dataset.loesung;
    k.classList.remove("richtig", "falsch");
    void k.offsetWidth;  // Animation neu starten
    k.classList.add(stimmt ? "richtig" : "falsch");
    if (stimmt) richtig++;
  });

  const gesamt = felder.length;
  if (belegt === 0) { zeigeStatus(TEXTE.leer); return; }

  if (richtig === gesamt) {
    fertig = true;
    app.classList.add("fertig");
    karten.forEach((k) => { k.disabled = true; });
    zeigeStatus(TEXTE.allesRichtig, true);
    return;
  }

  const teile = [TEXTE.teilweise(richtig, gesamt)];
  if (belegt > richtig) teile.push(TEXTE.falsche);
  if (belegt < gesamt) teile.push(TEXTE.freieFelder(gesamt - belegt));
  zeigeStatus(teile.join(" "));
});

document.getElementById("neu").addEventListener("click", () => {
  fertig = false;
  app.classList.remove("fertig");
  waehle(null);
  karten.forEach((k) => {
    k.disabled = false;
    k.classList.remove("richtig", "falsch");
    k.zuhause.appendChild(k);
  });
  zeigeStatus(TEXTE.start);
});

zeigeStatus(TEXTE.start);
</script>
</body>
