<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lückentext</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #161B22;
    --ink: #E6EBF0;
    --muted: #9AA7B3;
    --line: #2E3843;
    --field: #212933;
    --field-line: #3D4957;
    --accent: #5BB8C4;
    --ok: #7EDDA3;   --ok-bg: rgba(92, 201, 138, .14);
    --bad: #FF8F84;  --bad-bg: rgba(240, 122, 110, .15);
    --sol: #F0CD6E;  --sol-bg: rgba(232, 193, 90, .14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body { padding: clamp(16px, 4vw, 40px); }
  main { max-width: 46rem; margin: 0 auto; }

  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 .4rem; font-weight: 700; letter-spacing: .005em; }
  .anleitung { color: var(--muted); margin: 0 0 1.75rem; line-height: 1.5; }

  .text p { font-size: 1.125rem; line-height: 2.4; margin: 0 0 1rem; }
  .text ul { font-size: 1.125rem; line-height: 2.4; margin: 0 0 1rem; padding-left: 1.5rem; }
  .text li::marker { color: var(--accent); }
  .text strong { font-weight: 700; }

  .gap {
    font: inherit;
    color: var(--ink);
    caret-color: var(--accent);
    background: var(--field);
    border: 0;
    border-bottom: 2px solid var(--field-line);
    border-radius: 4px 4px 0 0;
    padding: .1rem .4rem;
    margin: 0 .1rem;
    max-width: 100%;
    text-align: center;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .gap:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-bottom-color: var(--accent); }
  .gap.richtig { background: var(--ok-bg);  border-bottom-color: var(--ok);  color: var(--ok); }
  .gap.falsch  { background: var(--bad-bg); border-bottom-color: var(--bad); color: var(--bad); }
  .gap.geloest { background: var(--sol-bg); border-bottom-color: var(--sol); color: var(--sol); }
  .gap.geloest { border-bottom-style: dashed; }
  .gap[readonly] { cursor: default; }
  .gap-huelle { white-space: nowrap; }
  .zeichen { display: inline-block; width: 1.1em; margin-left: .15rem; font-weight: 700; }
  .zeichen.richtig { color: var(--ok); }
  .zeichen.falsch  { color: var(--bad); }

  .extern { display: inline-block; margin: 0 0 1.5rem; color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
  .extern[hidden] { display: none; }
  .extern:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }

  .wortliste { margin: 1.5rem 0 0; padding: 1rem 1.1rem 1.1rem; background: var(--field); border-radius: 8px; }
  .wortliste[hidden] { display: none; }
  .wortliste h2 { font-size: 1rem; font-weight: 700; color: var(--muted); margin: 0 0 .75rem; }
  .woerter { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
  .woerter li { padding: .3rem .75rem; border: 1px solid var(--field-line); border-radius: 999px; line-height: 1.4; transition: opacity .15s; }
  .woerter li.benutzt { color: var(--muted); text-decoration: line-through; opacity: .55; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .auswertung { margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
  .ergebnis { margin: 0 0 1rem; font-size: 1.05rem; line-height: 1.5; }
  .ergebnis:empty { display: none; }
  .knoepfe { display: flex; flex-wrap: wrap; gap: .6rem; }

  button {
    font: inherit;
    font-size: 1rem;
    padding: .6rem 1.1rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  button[hidden] { display: none; }
  .primaer   { background: var(--accent); color: #0D1F23; font-weight: 700; }
  .primaer:hover { background: #74C8D3; border-color: #74C8D3; }
  .sekundaer { background: transparent; color: var(--accent); }
  .sekundaer:hover { background: rgba(91, 184, 196, .12); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { .gap, button, .woerter li { transition: none; } }
</style>
</head>
<body>
<main>

  <!-- ====== HIER ANPASSEN: Überschrift und Arbeitsanweisung ====== -->
  <h1>Blende und Schärfentiefe</h1>
  <p class="anleitung">Ergänze die fehlenden Begriffe. Mit der Eingabetaste springst du zur nächsten Lücke.</p>
  <a class="extern" id="extern" href="#" target="_blank" rel="noopener" hidden>Übung in eigenem Fenster öffnen</a>

  <!--
    ====== HIER ANPASSEN: Der Lückentext ======
    - Jede Lücke steht in eckigen Klammern:   [Antwort]
    - Mehrere richtige Antworten mit |:       [Glucose|Glukose|Traubenzucker]
      (die erste wird bei „Lösungen anzeigen" eingesetzt und in der Wortliste gezeigt)
    - Einfacher Zeilenumbruch = wird ignoriert, der Text läuft weiter.
    - Eine Leerzeile beginnt einen neuen Absatz.
    - Eine Zeile, die mit "- " beginnt, wird ein Aufzählungspunkt.
    - Fett:   <strong>Wort</strong>     Kursiv:   <em>Wort</em>
    - Beliebig viele Lücken möglich.
  -->
  <script type="text/plain" id="lueckentext">
Die Blende regelt die Menge des einfallenden [Lichtes]. Sie beeinflusst die [Schärfentiefe]. Dabei gilt: Je <strong>größer</strong> die Blende (Zahl), desto [kleiner] ist die
Blendenöffnung und desto [kleiner] ist das einfallende Strahlenbündel. Folglich [steigt] die Schärfentiefe und Nah- und Fernpunkt sind weiter vom fokussierten
Punkt entfernt. Je <strong>kleiner</strong> die Blende (Zahl), desto [größer] ist die Blendenöffnung und desto [größer] ist das einfallende Strahlenbündel. Folglich [sinkt] die Schärfentiefe
und Nah- und Fernpunkt nähern sich dem fokussierten Punkt.

- [Große] Blende = Kleine Blendenzahl = [Geringe] Schärfentiefe
- [Kleine] Blende = Große Blendenzahl = [Kleine] Schärfentiefe

Änderungen um einen Blendenwert bewirken doppelte bzw. halbe [Lichtmenge].
  </script>

  <!--
    ====== HIER ANPASSEN: Distraktoren (falsche Wörter für die Wortliste) ======
    - Ein Wort pro Zeile.
    - Leer lassen, wenn die Wortliste nur die richtigen Wörter zeigen soll.
  -->
  <script type="text/plain" id="distraktoren">
  </script>

  <div class="text" id="text"></div>

  <section class="wortliste" id="wortliste" aria-labelledby="wortliste-titel" hidden>
    <h2 id="wortliste-titel">Wörter zur Auswahl</h2>
    <ul class="woerter" id="woerter"></ul>
  </section>

  <div class="auswertung">
    <p class="ergebnis" id="ergebnis" aria-live="polite"></p>
    <div class="knoepfe">
      <button type="button" class="primaer" id="pruefen">Antworten prüfen</button>
      <button type="button" class="sekundaer" id="wortlisteKnopf" aria-controls="wortliste" aria-expanded="false" hidden>Wortliste einblenden</button>
      <button type="button" class="sekundaer" id="loesungen" hidden>Lösungen anzeigen</button>
      <button type="button" class="sekundaer" id="neu" hidden>Von vorn beginnen</button>
    </div>
  </div>

</main>

<script>
  // ====== HIER ANPASSEN: Einstellungen ======
  const EINSTELLUNGEN = {
    grossKleinBeachten: false,      // true = "wasser" gilt als falsch, wenn "Wasser" erwartet wird
    loesungenAnzeigenErlaubt: true, // false = Knopf "Lösungen anzeigen" erscheint nie

    // Wortliste unter dem Text:
    //   'aus'   = keine Wortliste
    //   'an'    = Wortliste immer sichtbar
    //   'knopf' = Lernende können sie per Knopf ein- und ausblenden
    wortliste: 'knopf',
    // 'zufall' = Wörter gemischt, 'alphabetisch' = Wörter nach Alphabet sortiert
    wortlisteReihenfolge: 'zufall'
  };

  // ---------- Ab hier nichts mehr ändern nötig ----------
  const textEl = document.getElementById('text');
  const ergebnisEl = document.getElementById('ergebnis');
  const btnPruefen = document.getElementById('pruefen');
  const btnLoesungen = document.getElementById('loesungen');
  const btnNeu = document.getElementById('neu');

  const luecken = []; // { input, antworten, status: 'offen'|'richtig'|'falsch'|'geloest' }

  // Erzeugt ein Eingabefeld für eine Lücke
  function lueckeErzeugen(inhalt) {
    const antworten = inhalt.split('|').map(a => a.trim()).filter(Boolean);
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'gap';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('aria-label', 'Lücke ' + (luecken.length + 1));
    input.style.width = (Math.max(...antworten.map(a => a.length)) + 3) + 'ch';
    const zeichen = document.createElement('span');
    zeichen.className = 'zeichen';
    zeichen.setAttribute('aria-hidden', 'true');
    const luecke = { input, antworten, zeichen, nr: luecken.length + 1, status: 'offen' };
    luecken.push(luecke);

    input.addEventListener('input', () => {
      if (luecke.status === 'falsch') { luecke.status = 'offen'; darstellen(luecke); }
    });
    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const naechste = luecken.slice(luecken.indexOf(luecke) + 1).find(l => !l.input.readOnly);
      if (naechste) naechste.input.focus(); else pruefen();
    });

    const huelle = document.createElement('span');
    huelle.className = 'gap-huelle';
    huelle.append(input, zeichen);
    luecke.huelle = huelle;
    return luecke;
  }

  // Setzt Text mit Lücken und Formatierung (z. B. <strong>) in ein Element ein
  function inhaltEinsetzen(ziel, text) {
    const neue = [];
    ziel.innerHTML = text.replace(/\[([^\]]+)\]/g, (_, inhalt) => {
      neue.push(lueckeErzeugen(inhalt));
      return '<span data-luecke="' + (neue.length - 1) + '"></span>';
    });
    ziel.querySelectorAll('span[data-luecke]').forEach(platz => {
      platz.replaceWith(neue[Number(platz.dataset.luecke)].huelle);
    });
  }

  // Text einlesen: Leerzeile = neuer Absatz, Zeile mit "- " = Aufzählungspunkt
  const quelle = document.getElementById('lueckentext').textContent.trim();
  quelle.split(/\n\s*\n/).forEach(block => {
    let absatz = [];
    let liste = null;
    const absatzAbschliessen = () => {
      if (absatz.length === 0) return;
      const p = document.createElement('p');
      inhaltEinsetzen(p, absatz.join(' ').replace(/\s+/g, ' '));
      textEl.append(p);
      absatz = [];
    };
    block.split('\n').forEach(zeile => {
      const punkt = zeile.match(/^\s*[-•]\s+(.*)$/);
      if (punkt) {
        absatzAbschliessen();
        if (!liste) { liste = document.createElement('ul'); textEl.append(liste); }
        const li = document.createElement('li');
        inhaltEinsetzen(li, punkt[1].trim());
        liste.append(li);
      } else if (zeile.trim()) {
        liste = null;
        absatz.push(zeile.trim());
      }
    });
    absatzAbschliessen();
  });

  function normalisieren(s) {
    s = s.trim().replace(/\s+/g, ' ');
    return EINSTELLUNGEN.grossKleinBeachten ? s : s.toLocaleLowerCase('de');
  }

  function darstellen(l) {
    l.input.classList.remove('richtig', 'falsch', 'geloest');
    if (l.status !== 'offen') l.input.classList.add(l.status);
    l.input.readOnly = (l.status === 'richtig' || l.status === 'geloest');
    l.input.setAttribute('aria-invalid', l.status === 'falsch' ? 'true' : 'false');
    l.zeichen.className = 'zeichen ' + l.status;
    l.zeichen.textContent = { richtig: '✓', falsch: '✗' }[l.status] || '';
    const zusatz = { richtig: ', richtig', falsch: ', falsch', geloest: ', Lösung eingesetzt' }[l.status] || '';
    l.input.setAttribute('aria-label', 'Lücke ' + l.nr + zusatz);
  }

  // Auf dem Handy innerhalb von Genially: Link zum Öffnen in eigenem Fenster anzeigen
  (function () {
    const eingebettet = window.self !== window.top;
    const kleinerBildschirm = Math.min(screen.width, screen.height) < 600;
    if (eingebettet && kleinerBildschirm) {
      const link = document.getElementById('extern');
      link.href = location.href;
      link.hidden = false;
    }
  })();

  function pruefen() {
    luecken.forEach(l => {
      if (l.status === 'richtig' || l.status === 'geloest') return;
      const eingabe = normalisieren(l.input.value);
      l.status = l.antworten.some(a => normalisieren(a) === eingabe) ? 'richtig' : 'falsch';
      if (l.status === 'richtig') wortAbhaken(l);
      darstellen(l);
    });

    const gesamt = luecken.length;
    const richtig = luecken.filter(l => l.status === 'richtig').length;
    const falsche = luecken.filter(l => l.status === 'falsch');

    if (falsche.length === 0) {
      ergebnisEl.textContent = richtig === gesamt
        ? `Alle ${gesamt} Lücken richtig ausgefüllt. Sehr gut!`
        : `${richtig} von ${gesamt} Lücken selbst gelöst.`;
      btnPruefen.hidden = true;
      btnLoesungen.hidden = true;
    } else {
      ergebnisEl.textContent = `${richtig} von ${gesamt} Lücken richtig. Korrigiere die rot markierten Lücken und prüfe erneut.`;
      btnPruefen.textContent = 'Erneut prüfen';
      btnLoesungen.hidden = !EINSTELLUNGEN.loesungenAnzeigenErlaubt;
      falsche[0].input.focus();
    }
    btnNeu.hidden = false;
  }

  function loesungenAnzeigen() {
    luecken.forEach(l => {
      if (l.status === 'richtig') return;
      l.input.value = l.antworten[0];
      l.status = 'geloest';
      wortAbhaken(l);
      darstellen(l);
    });
    const richtig = luecken.filter(l => l.status === 'richtig').length;
    ergebnisEl.textContent = `${richtig} von ${luecken.length} Lücken selbst gelöst. Die gelb markierten Lücken zeigen die Lösung.`;
    btnPruefen.hidden = true;
    btnLoesungen.hidden = true;
  }

  function neuBeginnen() {
    luecken.forEach(l => { l.input.value = ''; l.status = 'offen'; darstellen(l); });
    ergebnisEl.textContent = '';
    wortlisteZuruecksetzen();
    btnPruefen.textContent = 'Antworten prüfen';
    btnPruefen.hidden = false;
    btnLoesungen.hidden = true;
    btnNeu.hidden = true;
    if (luecken[0]) luecken[0].input.focus();
  }

  // ---------- Wortliste ----------
  const wortlisteEl = document.getElementById('wortliste');
  const woerterEl = document.getElementById('woerter');
  const btnWortliste = document.getElementById('wortlisteKnopf');
  const wortEintraege = []; // { text, li, hinweis, benutzt }

  function wortlisteAufbauen() {
    const distraktoren = document.getElementById('distraktoren').textContent
      .split('\n').map(w => w.trim()).filter(Boolean);
    const woerter = luecken.map(l => l.antworten[0]).concat(distraktoren);

    if (EINSTELLUNGEN.wortlisteReihenfolge === 'alphabetisch') {
      woerter.sort((a, b) => a.localeCompare(b, 'de'));
    } else {
      for (let i = woerter.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [woerter[i], woerter[j]] = [woerter[j], woerter[i]];
      }
    }

    if (distraktoren.length === 0) {
      document.getElementById('wortliste-titel').textContent = 'Diese Wörter gehören in die Lücken';
    }

    woerter.forEach(text => {
      const li = document.createElement('li');
      const wort = document.createElement('span');
      wort.textContent = text;
      const hinweis = document.createElement('span');
      hinweis.className = 'sr-only';
      li.append(wort, hinweis);
      woerterEl.append(li);
      wortEintraege.push({ text, li, hinweis, benutzt: false });
    });
  }

  // Streicht ein passendes Wort in der Wortliste durch, sobald die Lücke gelöst ist
  function wortAbhaken(l) {
    const eintrag = wortEintraege.find(e => !e.benutzt && e.text === l.antworten[0]);
    if (!eintrag) return;
    eintrag.benutzt = true;
    eintrag.li.classList.add('benutzt');
    eintrag.hinweis.textContent = ' (bereits eingesetzt)';
  }

  function wortlisteZuruecksetzen() {
    wortEintraege.forEach(e => {
      e.benutzt = false;
      e.li.classList.remove('benutzt');
      e.hinweis.textContent = '';
    });
  }

  if (EINSTELLUNGEN.wortliste === 'an' || EINSTELLUNGEN.wortliste === 'knopf') {
    wortlisteAufbauen();
    if (EINSTELLUNGEN.wortliste === 'an') wortlisteEl.hidden = false;
    else btnWortliste.hidden = false;
  }

  btnWortliste.addEventListener('click', () => {
    const zeigen = wortlisteEl.hidden;
    wortlisteEl.hidden = !zeigen;
    btnWortliste.textContent = zeigen ? 'Wortliste ausblenden' : 'Wortliste einblenden';
    btnWortliste.setAttribute('aria-expanded', String(zeigen));
  });

  btnPruefen.addEventListener('click', pruefen);
  btnLoesungen.addEventListener('click', loesungenAnzeigen);
  btnNeu.addEventListener('click', neuBeginnen);
</script>
</body>
</html>
